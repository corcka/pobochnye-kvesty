function go(d){ pos = (pos + d + list.length) % list.length; track(d>0?"next":"prev"); flipped = false; rx = ry = 0;
  card.classList.remove("tracking");
  card.animate([{transform:`translateX(${d*-30}px) rotateY(${d*-12}deg)`,opacity:.3},{transform:"none",opacity:1}],{duration:320,easing:"cubic-bezier(.2,.8,.2,1)"});
  apply(); render(); }
function flip(){ flipped = !flipped; track("flip", {card: list[pos].title}); card.classList.remove("tracking"); apply(); }
function draw(){
  setMode(false); track("draw");
  const pool = list.length > 1 ? list : CARDS;
  let n; do { n = Math.floor(Math.random()*pool.length) } while (pool.length > 1 && n === pos && pool === list);
  if (pool !== list){ filter = null; list = CARDS; renderFilters(); }
  pos = n; flipped = true; rx = ry = 0; render(); apply();
  setTimeout(() => { flipped = false; card.classList.remove("tracking"); apply(); }, 380);
}

// tilt
scene.addEventListener("pointermove", e => {
  if (e.pointerType === "touch") return;
  const r = scene.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
  ry = (px - .5) * 22 * (flipped ? -1 : 1); rx = (.5 - py) * 18;
  card.classList.add("tracking"); apply();
  card.querySelectorAll(".glare").forEach(g => { g.style.setProperty("--gx", (flipped?1-px:px)*100+"%"); g.style.setProperty("--gy", py*100+"%"); });
  card.querySelectorAll(".sheen").forEach(s => s.style.setProperty("--sx", (flipped?1-px:px)*100+"%"));
});
scene.addEventListener("pointerleave", () => { rx = ry = 0; card.classList.remove("tracking"); apply(); });

// click vs swipe
let sx = null, sy = null;
scene.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
scene.addEventListener("pointerup", e => {
  if (sx === null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1); else flip();
});

$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("draw").onclick = draw;
document.addEventListener("keydown", e => {
  if (document.body.classList.contains("grid-mode")) return;
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); }
  else if (e.key.toLowerCase() === "r" || e.key.toLowerCase() === "к") draw();
});

// filters
function renderFilters(){
  const box = $("filters");
  const all = `<button class="chip" aria-pressed="${filter===null}" data-s="">Все<span class="n">${CARDS.length}</span></button>`;
  box.innerHTML = all + SUITS.map(s => {
    const n = CARDS.filter(c => c.suit === s).length;
    return `<button class="chip" aria-pressed="${filter===s}" data-s="${s}">${s}<span class="n">${n}</span></button>`;
  }).join("");
  box.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    filter = b.dataset.s || null; track("filter", {suit: filter || "Все"});
    list = filter ? CARDS.filter(c => c.suit === filter) : CARDS;
    pos = 0; flipped = false; rx = ry = 0; renderFilters(); render(); apply(); renderGrid();
  });
}

// grid
function renderGrid(){
  $("grid").innerHTML = list.map((c,i) => `<button class="thumb" data-i="${i}" title="${c.suit} — ${c.title}"><img loading="lazy" src="${c.file}" alt="${c.suit} — ${c.title}"></button>`).join("");
  $("grid").querySelectorAll(".thumb").forEach(b => b.onclick = () => { pos = +b.dataset.i; flipped = false; setMode(false); render(); apply(); });
}
function setMode(grid){
  if (grid !== document.body.classList.contains("grid-mode")) track(grid ? "grid_open" : "grid_close");
  document.body.classList.toggle("grid-mode", grid);
  $("mode").textContent = grid ? "По одной" : "Вся колода";
}
$("mode").onclick = () => setMode(!document.body.classList.contains("grid-mode"));

renderFilters(); render(); renderGrid(); apply();
</script>
</body>
</html>
